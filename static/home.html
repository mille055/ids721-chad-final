<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient-Friendly Radiology Report Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #bacbd9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
        }

        h1, h2 {
            color: #333;
        }

        textarea {
            width: 100%;
            font-size: 1rem;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: vertical;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #004f99;
        }

        p#highlighted, p#result {
            min-height: 60px;
            background-color: #f3f6fa;
            border-left: 4px solid #0066cc;
            padding: 15px;
            border-radius: 6px;
            font-size: 1rem;
        }

        form {
            margin-bottom: 30px;
        }
    </style>
    <script>
        async function submitForm(event) {
            event.preventDefault();
            const findings = document.getElementById('findings').value;

            const highlightResponse = await fetch('/highlight', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ findings })
            });
            const highlightedText = await highlightResponse.text();
            document.getElementById('highlighted').innerHTML = highlightedText;

            document.getElementById('result').innerHTML = `<em>Loading patient-friendly explanation...</em>`;

            try {
                const explainResponse = await fetch('/explain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ findings })
                });

                if (!explainResponse.ok) {
                    throw new Error("Failed to get explanation");
                }

                const data = await explainResponse.json();
                document.getElementById('result').innerText = data.patient_explanation;
            } catch (error) {
                console.error('Error during explain fetch:', error);
                document.getElementById('result').innerText = "Failed to generate explanation.";
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Radiology Findings to Patient-Friendly Language</h1>
        <form onsubmit="submitForm(event)">
            <textarea id="findings" name="findings" rows="10" placeholder="Paste radiology findings here..."></textarea><br>
            <button type="submit">Convert</button>
        </form>

        <h2>Highlighted Findings (hover over terms to reveal definitions):</h2>
        <p id="highlighted"></p>

        <h2>Patient-Friendly Explanation:</h2>
        <p id="result"></p>
    </div>
</body>
</html>
