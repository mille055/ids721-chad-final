version: '3.8'

services:
  llama:
    build:
      context: ./llamafile
      dockerfile: Dockerfile.llamafile
    container_name: llamafile-server
    ports:
      - "8080:8080"
  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patient-converter
    ports:
      - "8000:8000"
    environment:
      - LLAMA_SERVER_URL=http://llama:8080
    depends_on:
      - llama
